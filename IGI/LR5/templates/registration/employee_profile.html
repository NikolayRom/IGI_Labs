{% extends "base_generic.html" %}

{% block title %}
<title>My Profile</title>
{% endblock %}

{% block content %}

    <h2>Profile:</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <ul>Employee created: {{employee.created_at|date:"d/m/Y H:i"}}</ul>
        <ul>Employee updated: {{employee.updated_at|date:"d/m/Y H:i"}}</ul>
        <button type="submit">Submit</button>
    </form>

{% endblock %}
