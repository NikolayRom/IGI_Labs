{% extends "base_generic.html" %}

{% block title %}
  <title>Delete Product</title>
{% endblock %}

{% block content %}
  {% if perms.ToyFactory.employee_perm %}
    <h1>Delete Product</h1>

    <p>Are you sure you want to delete the Product: {{ product }}?</p>

    <form action="" method="POST">
      {% csrf_token %}
      <input type="submit" value="Yes, delete." />
    </form>
  {% else %}
    <h1>Access Denied</h1>
  {% endif %}
{% endblock %}
