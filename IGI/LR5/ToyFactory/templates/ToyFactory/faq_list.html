{% extends "base_generic.html" %}

{% block title %}
<title>FAQ</title>
{% endblock %}

{% block content %}
    <h1>FAQ</h1>

    {% if faq_list %}
    <ul>

      {% for faq in faq_list %}
        <li>
            <a href="{{ faq.get_absolute_url }}">{{ faq.question }}</a> ({{faq.updated_at|date:"d/m/Y H:i"}})
            <br>
        </li>
      {% endfor %}

    </ul>
    {% else %}
      <p>There are no faq available.</p>
    {% endif %}
{% endblock %}
