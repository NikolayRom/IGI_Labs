{% extends "base_generic.html" %}

{% block title %}
<title>My Profile</title>
{% endblock %}

{% block content %}

    <h1>Profile:</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <ul>Client created: {{client.created_at|date:"d/m/Y H:i"}}</ul>
        <ul>Client updated: {{client.updated_at|date:"d/m/Y H:i"}}</ul>
        <button type="submit">Submit</button>
    </form>

{% endblock %}
