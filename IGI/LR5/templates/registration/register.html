{% extends "base_generic.html" %}

{% block content %}

{% if form.errors %}
  <p>Something wrong...</p>
{% endif %}

    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>

{% endblock %}
