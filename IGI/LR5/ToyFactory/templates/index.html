{% extends "base_generic.html" %}

{% block title %}
  <title>Home</title>
{% endblock %}

{% block content %}
  {% if last_news %}
    <a href="{{last_news.get_absolute_url}}"><h2>{{last_news.header}}</h2></a>
    {% if last_news.image %}
      <img src='{{last_news.image.url}}' alt="News picture" style="max-width: 300px;"/>
    {% else %}
      <img src='/media/default_news_logo.png' alt="News default picture" style="max-width: 300px;"/>
    {% endif %}
    <ul>{{last_news.pub_date}}</ul>
  {% else %}
    <p>No news available</p>
  {% endif %}
{% endblock %}
